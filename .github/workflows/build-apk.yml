name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Get version from build.gradle
        id: ver
        run: |
          V=$(grep "versionName" android/app/build.gradle | head -1 | sed "s/.*'\(.*\)'.*/\1/")
          echo "name=$V" >> $GITHUB_OUTPUT
          SAFE=$(echo $V | tr '.' '_')
          echo "safe=$SAFE" >> $GITHUB_OUTPUT
          echo "apk=ailurix_arena_v${SAFE}.apk" >> $GITHUB_OUTPUT
          echo "Version: $V"

      - name: Sync game files to Android assets
        run: |
          cp public/game/game.js      android/app/src/main/assets/game.js
          cp public/game/mp-client.js android/app/src/main/assets/mp-client.js
          cp public/game/bg_*.png     android/app/src/main/assets/ 2>/dev/null || true
          echo "Assets synced!"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" > $ANDROID_HOME/licenses/android-sdk-preview-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Install required Android SDK components
        run: |
          SDKMANAGER=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
          echo "y" | $SDKMANAGER "platforms;android-34" "build-tools;33.0.2" 2>&1 | tail -5
          echo "SDK components installed!"

      - name: Patch gradle.properties for CI
        run: |
          echo "android.suppressUnsupportedCompileSdk=34" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g" >> android/gradle.properties
          echo "android.useAndroidX=true" >> android/gradle.properties

      - name: Build Debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Rename APK
        id: apk
        run: |
          APK_SRC=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          APK_NAME="${{ steps.ver.outputs.apk }}"
          cp "$APK_SRC" "$APK_NAME"
          echo "path=$APK_NAME" >> $GITHUB_OUTPUT
          echo "APK ready: $APK_NAME"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ailurix-Arena-v${{ steps.ver.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: "⚔️ Ailurix Arena v${{ steps.ver.outputs.name }}"
          body: |
            ## ⚔️ Ailurix Arena v${{ steps.ver.outputs.name }}

            ### 📥 Install
            Download the APK file below and install on Android.

            ### ✨ What's New
            - Real-time 1v1 Online Multiplayer (CUSTOM FIGHT)
            - CPU bypassed in MP fights
            - SP onclick blocked when in MP room

            ---
            *Auto-built by GitHub Actions*
          files: ${{ steps.apk.outputs.path }}
          make_latest: true