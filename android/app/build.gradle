apply plugin: 'com.android.application'
android {
  namespace 'com.dominex.arena'
  compileSdkVersion 34
  buildToolsVersion '33.0.2'
  defaultConfig {
    applicationId 'com.dominex.arena'
    minSdkVersion 21
    targetSdkVersion 34
    versionCode 190
    versionName '15.13.34'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
  buildTypes {
    release {
      minifyEnabled false
      signingConfig signingConfigs.debug
    }
  }
  aaptOptions {
    // Prevent compression of audio assets — required for MediaPlayer.setDataSource(AssetFileDescriptor)
    // Without this, openFd() returns wrong offsets for compressed assets → playback fails silently
    noCompress 'mp3', 'ogg', 'wav', 'm4a'
  }
}
